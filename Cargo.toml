[workspace]
resolver = "3"
members = ["src-tauri", "crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/jutsuhq/kawarimi-local-character-swap"

[workspace.dependencies]
kawarimi-assets = { path = "crates/kawarimi-assets" }
kawarimi-media = { path = "crates/kawarimi-media" }
edgetam-onnx = { git = "https://github.com/jutsuhq/edgetam-onnx", tag = "v0.1.0" }
kawarimi-prep = { path = "crates/kawarimi-prep" }
kawarimi-comfy = { path = "crates/kawarimi-comfy" }
kawarimi-llm = { path = "crates/kawarimi-llm" }
kawarimi-mcp = { path = "crates/kawarimi-mcp" }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "process", "sync"] }
futures-util = "0.3"
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
ndarray = "0.17"
ort = { version = "=2.0.0-rc.14", features = ["cuda"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[profile.dev.package."*"]
opt-level = 2
