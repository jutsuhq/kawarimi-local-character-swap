# Builds the installers as scripts/release.sh does. A v* tag puts them, with SHA256SUMS, in a draft prerelease;
# a manual run only keeps them as the run's artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: python
            bundles: nsis
            config: src-tauri/tauri.release.windows.json
            ort: onnxruntime_providers_cuda.dll onnxruntime_providers_shared.dll
            files: target/release/bundle/nsis/*.exe
          - os: ubuntu-24.04
            python: python3
            bundles: deb,appimage
            config: src-tauri/tauri.release.linux.json
            ort: libonnxruntime_providers_cuda.so libonnxruntime_providers_shared.so
            files: target/release/bundle/appimage/*.AppImage target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./src-tauri/tauri.conf.json').version")" = "$GITHUB_REF_NAME"
      - name: Linux packages for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libdbus-1-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: ${{ matrix.python }} scripts/licenses.py
      - run: cargo build --release -p kawarimi
      # ONNX Runtime is linked in, but its CUDA provider is a library it loads from the executable's folder.
      - run: |
          mkdir -p src-tauri/resources/ort
          for lib in ${{ matrix.ort }}; do cp "target/release/$lib" src-tauri/resources/ort/; done
      # The strip inside linuxdeploy fails on sections current toolchains write; the binary is already stripped.
      # CUDA comes from the cuda-runtime asset at run time and libcuda from the driver, so the AppImage leaves them out.
      - run: pnpm tauri build --bundles ${{ matrix.bundles }} --config ${{ matrix.config }}
        env:
          NO_STRIP: "true"
          APPIMAGE_EXTRACT_AND_RUN: "1"
          LINUXDEPLOY_EXCLUDED_LIBRARIES: "libcuda.so*;libcublas.so*;libcublasLt.so*;libcurand.so*;libcudart.so*"
      - run: mkdir out && cp ${{ matrix.files }} out/
      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: cd out && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - run: |
          gh release create "$GITHUB_REF_NAME" out/* --draft --prerelease --title "Kawarimi ${GITHUB_REF_NAME#v}" \
            --notes "Installers for Windows 10/11 and Linux, x86_64, NVIDIA GPU. Check them against SHA256SUMS."
        env:
          GH_TOKEN: ${{ github.token }}
