[package]
name = "kawarimi-llm"
description = "The optional prompt writer: llama-server as a managed child process, or an OpenAI-compatible API"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kawarimi-assets.workspace = true
kawarimi-media.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
image.workspace = true
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile.workspace = true
