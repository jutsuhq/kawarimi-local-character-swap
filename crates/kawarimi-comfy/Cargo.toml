[package]
name = "kawarimi-comfy"
description = "ComfyUI on the user's machine: a locked install, and the server as a managed child process"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
kawarimi-assets.workspace = true
kawarimi-media.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
image.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects"] }

[dev-dependencies]
tempfile.workspace = true
